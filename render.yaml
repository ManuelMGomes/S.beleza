services:
  - type: web
    name: genomni-salon-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: genomni-salon-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: genomni-salon-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PROJECT_NAME
        value: GenOmni Salon API
      - key: API_V1_PREFIX
        value: /api/v1
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: CACHE_TTL_SECONDS
        value: "60"

  - type: keyvalue
    name: genomni-salon-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: genomni-salon-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: saas_db
    ipAllowList: []
